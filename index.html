<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>每日读论文</title>
    <meta name="description" content="用卡片浏览、检索和筛选论文。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Outfit:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="masthead">
        <p class="eyebrow">Daily Paper Reading</p>
        <h1>每日读论文</h1>
        <p class="lede">
          把值得反复打开的论文摊成一叠卡片。按题目、作者或摘要检索，按主题和年份收束，点开卡片阅读完整提要。
        </p>
      </header>

      <section class="toolbar" aria-label="筛选">
        <div class="controls">
          <label class="field">
            <span>检索</span>
            <input id="search" type="search" placeholder="搜索题目、作者、会议或摘要" autocomplete="off" />
          </label>
          <label class="field">
            <span>年份</span>
            <select id="year"></select>
          </label>
          <label class="field">
            <span>排序</span>
            <select id="sort">
              <option value="year-desc">年份从新到旧</option>
              <option value="year-asc">年份从旧到新</option>
              <option value="title">按标题</option>
            </select>
          </label>
        </div>
        <div id="topics" class="chips" aria-label="主题"></div>
      </section>

      <div class="meta-row">
        <p id="count">共 0 篇</p>
        <button id="clear" class="ghost" type="button" hidden>清除筛选</button>
      </div>

      <main id="grid" class="grid" aria-live="polite"></main>
      <div id="empty" class="empty" hidden>
        <h2>没有找到匹配的论文</h2>
        <p>换一个关键词，或清除主题、年份后再试。</p>
      </div>

      <footer class="foot">DailyPaperReading · 卡片只作导读，原文以会议与预印本为准。</footer>
    </div>

    <dialog id="paper-dialog" aria-labelledby="dialog-title">
      <div class="dialog-panel">
        <button id="dialog-close" class="dialog-close" type="button">关闭</button>
        <div id="dialog-body"></div>
      </div>
    </dialog>

    <script src="js/filter.js"></script>
    <script src="js/papers.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
